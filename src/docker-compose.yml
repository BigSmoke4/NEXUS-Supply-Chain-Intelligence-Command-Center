version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: ["nexus-pgdata:/var/lib/postgresql/data"]

  web:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Nexus: "Host=postgres;Database=nexus;Username=nexus;Password=nexus"
      Database__InitializeOnStartup: "true"
      HttpsRedirection__Enabled: "false"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nexus-pgdata:

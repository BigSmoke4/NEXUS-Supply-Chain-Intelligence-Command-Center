version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    volumes: ["nexus-pgdata:/var/lib/postgresql/data"]

  web:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Nexus: "Host=postgres;Database=nexus;Username=nexus;Password=nexus"
    depends_on: ["postgres"]

volumes:
  nexus-pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_enterprise_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_secure_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_enterprise_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nexus-ml-api:
    build:
      context: .
      dockerfile: ML/Dockerfile
    container_name: nexus-ml-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  nexus-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-web
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nexus-ml-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-nexus_enterprise_db};Username=${POSTGRES_USER:-nexus};Password=${POSTGRES_PASSWORD:-nexus_secure_password}
      ConnectionStrings__Redis: redis:6379
      Database__InitializeOnStartup: "true"
      Database__UseInMemory: "false"
      ML__ApiBaseUrl: http://nexus-ml-api:8000

volumes:
  nexus_pgdata:
